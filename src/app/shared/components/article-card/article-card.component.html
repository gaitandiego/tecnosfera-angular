<article class="card">
  <a class="card__media" [routerLink]="['/noticias', article().id]">
    <app-image-placeholder
      [src]="article().image"
      [alt]="article().title"
      variant="card" />
  </a>

  <div class="card__body">
    <span class="card__cat">{{ article().category | categoryLabel | uppercase }}</span>
    <h3 class="card__title">{{ article().title }}</h3>
    <p class="card__text">{{ article().summary }}</p>

    <div class="card__foot">
      <a [routerLink]="['/noticias', article().id]" class="btn btn--dark btn--sm">Ver más</a>
      <button
        type="button"
        class="fav-toggle"
        [class.is-active]="isFavorite()"
        [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
        (click)="toggleFavorite()"
        data-testid="card-favorite-toggle">
        <i class="fa-solid fa-heart"></i>
      </button>
    </div>
  </div>
</article>
